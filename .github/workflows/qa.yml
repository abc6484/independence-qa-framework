name: API quality gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install framework and lab
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python scripts/bootstrap.py
      - name: Run one cross-API quality gate
        run: .venv/bin/python scripts/run_lab.py --isolated-lab
      - name: Keep evidence even when vulnerabilities fail the gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-api-evidence
          path: artifacts/
          retention-days: 7
